name: KMD cluster-autoscaler image

on:
  push:
    tags:
      - 'cluster-autoscaler-*-kmd.*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kmd-digital-platform/cluster-autoscaler

jobs:
  build-pr:
    if: github.repository_owner == 'KMD-Digital-Platform' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build cluster-autoscaler (linux/${{ matrix.arch }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: cluster-autoscaler
          file: cluster-autoscaler/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: GOARCH=${{ matrix.arch }}
          push: false
          tags: ${{ env.IMAGE }}:pr${{ github.event.pull_request.number }}-${{ matrix.arch }}

  build:
    if: github.repository_owner == 'KMD-Digital-Platform' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cluster-autoscaler (linux/${{ matrix.arch }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: cluster-autoscaler
          file: cluster-autoscaler/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: GOARCH=${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}

  manifest:
    if: github.repository_owner == 'KMD-Digital-Platform' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble multi-arch manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
